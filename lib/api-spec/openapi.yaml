openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: guestbook
    description: Guestbook operations
  - name: productivity
    description: Worker productivity analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /guestbook:
    get:
      operationId: getGuestbook
      tags: [guestbook]
      summary: Get guestbook entries
      description: Returns guestbook entries in reverse-chronological order (newest first), up to 100 entries
      responses:
        "200":
          description: List of guestbook entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuestbookEntry"
    post:
      operationId: postGuestbook
      tags: [guestbook]
      summary: Create a guestbook entry
      description: Adds a new entry to the guestbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuestbookEntry"
      responses:
        "201":
          description: Created guestbook entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestbookEntry"
  /productivity/summary:
    get:
      operationId: getProductivitySummary
      tags: [productivity]
      summary: Overall productivity KPI summary
      description: Returns overall averages and per-employment-type breakdown
      responses:
        "200":
          description: Productivity summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductivitySummary"
  /productivity/by-type:
    get:
      operationId: getProductivityByType
      tags: [productivity]
      summary: Stats grouped by employment type
      description: Returns productivity, well-being, and hours averages per employment type
      responses:
        "200":
          description: Per-type breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmploymentTypeStats"
  /productivity/hours-impact:
    get:
      operationId: getProductivityHoursImpact
      tags: [productivity]
      summary: Hours-worked buckets vs scores
      description: Shows how different hours-worked ranges affect productivity and well-being scores
      responses:
        "200":
          description: Hours impact data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HoursImpactRow"
  /productivity/scatter:
    get:
      operationId: getProductivityScatter
      tags: [productivity]
      summary: Scatter plot data — hours vs productivity
      description: Returns individual data points for hours worked vs productivity score, colored by employment type. Capped at 300 rows.
      responses:
        "200":
          description: Scatter points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScatterPoint"
  /productivity/risk-profile:
    get:
      operationId: getProductivityRiskProfile
      tags: [productivity]
      summary: Burnout risk and high performer counts by employment type
      description: Returns burnout risk (high hours + low well-being) and high performer (high productivity + high well-being) counts
      responses:
        "200":
          description: Risk profile data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskProfileRow"
  /productivity/score-distribution:
    get:
      operationId: getProductivityScoreDistribution
      tags: [productivity]
      summary: Score distribution histogram data
      description: Returns bucketed distribution of productivity and well-being scores
      responses:
        "200":
          description: Score distribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreDistribution"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GuestbookEntry:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - message
        - createdAt
    CreateGuestbookEntry:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required:
        - name
        - message
    ProductivitySummary:
      type: object
      properties:
        totalEmployees:
          type: integer
        avgProductivity:
          type: number
        avgWellbeing:
          type: number
        avgHours:
          type: number
        remoteCount:
          type: integer
        inOfficeCount:
          type: integer
        productivityGap:
          type: number
        wellbeingGap:
          type: number
      required:
        - totalEmployees
        - avgProductivity
        - avgWellbeing
        - avgHours
        - remoteCount
        - inOfficeCount
        - productivityGap
        - wellbeingGap
    EmploymentTypeStats:
      type: object
      properties:
        employmentType:
          type: string
        count:
          type: integer
        avgProductivity:
          type: number
        avgWellbeing:
          type: number
        avgHours:
          type: number
      required:
        - employmentType
        - count
        - avgProductivity
        - avgWellbeing
        - avgHours
    HoursImpactRow:
      type: object
      properties:
        bucket:
          type: string
        minHours:
          type: integer
        avgProductivity:
          type: number
        avgWellbeing:
          type: number
        count:
          type: integer
      required:
        - bucket
        - minHours
        - avgProductivity
        - avgWellbeing
        - count
    ScatterPoint:
      type: object
      properties:
        employeeId:
          type: integer
        employmentType:
          type: string
        hoursWorked:
          type: integer
        productivityScore:
          type: integer
        wellbeingScore:
          type: integer
      required:
        - employeeId
        - employmentType
        - hoursWorked
        - productivityScore
        - wellbeingScore
    RiskProfileRow:
      type: object
      properties:
        employmentType:
          type: string
        burnoutRisk:
          type: integer
        highPerformers:
          type: integer
        total:
          type: integer
      required:
        - employmentType
        - burnoutRisk
        - highPerformers
        - total
    ScoreDistribution:
      type: object
      properties:
        productivity:
          type: array
          items:
            $ref: "#/components/schemas/DistributionBucket"
        wellbeing:
          type: array
          items:
            $ref: "#/components/schemas/DistributionBucket"
      required:
        - productivity
        - wellbeing
    DistributionBucket:
      type: object
      properties:
        bucket:
          type: string
        count:
          type: integer
        remote:
          type: integer
        inOffice:
          type: integer
      required:
        - bucket
        - count
        - remote
        - inOffice
