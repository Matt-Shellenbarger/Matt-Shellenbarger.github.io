openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: guestbook
    description: Guestbook operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /guestbook:
    get:
      operationId: getGuestbook
      tags: [guestbook]
      summary: Get guestbook entries
      description: Returns guestbook entries in reverse-chronological order (newest first), up to 100 entries
      responses:
        "200":
          description: List of guestbook entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuestbookEntry"
    post:
      operationId: postGuestbook
      tags: [guestbook]
      summary: Create a guestbook entry
      description: Adds a new entry to the guestbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuestbookEntry"
      responses:
        "201":
          description: Created guestbook entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestbookEntry"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GuestbookEntry:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - message
        - createdAt
    CreateGuestbookEntry:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required:
        - name
        - message
